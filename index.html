<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>色感對決</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 版面概念：驗光室的中性灰背景（避免干擾色彩判斷），中央一塊色盤，上方雙人進度條像賽道 */
:root {
  --bg: #e9e9ea;          /* 中性灰：色覺測試的標準環境 */
  --panel: #f6f6f7;
  --ink: #1d1f22;
  --muted: #6b6f76;
  --line: #cfd0d3;
  --p1: #2f5bd3;          /* 玩家一 */
  --p2: #d2482f;          /* 玩家二 */
  --ok: #1f8a4c;
  --bad: #c0352b;
  --font-display: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #2a2b2d; --panel: #343538; --ink: #ececee; --muted: #a2a5ab; --line: #47494d;
  --p1: #7a9bff; --p2: #ff8a70; --ok: #5fcf8d; --bad: #ff6f63; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #2a2b2d; --panel: #343538; --ink: #ececee; --muted: #a2a5ab; --line: #47494d;
  --p1: #7a9bff; --p2: #ff8a70; --ok: #5fcf8d; --bad: #ff6f63; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-body); font-weight: 900; font-size: 28px; margin: 0; letter-spacing: .02em; }
h1 small { font-family: var(--font-display); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .12em; margin-left: 6px; }
.conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--ok); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-size: 17px; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }
label { font-size: 12px; color: var(--muted); letter-spacing: .08em; display: block; margin-bottom: 6px; }
input[type=text] {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
}
input#code { font-family: var(--font-display); letter-spacing: .3em; text-transform: uppercase; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
button {
  font: inherit; font-weight: 700; font-size: 15px; padding: 11px 16px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--ink); background: var(--ink); color: var(--panel);
}
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, .tile:focus-visible, input:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }

.codebig { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .3em; }
.players { display: flex; flex-direction: column; gap: 10px; }
.pl { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; }
.pl .sw { width: 14px; height: 14px; border-radius: 4px; }
.pl .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .nm em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ready { border-color: var(--ok); color: var(--ok); }
.pill.done { border-color: var(--ink); color: var(--ink); }
.track { grid-column: 2 / 4; height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.track i { display: block; height: 100%; width: 0; transition: width .25s ease; }
.spect { font-size: 12px; color: var(--muted); }

/* 遊戲畫面 */
.hud { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: end; }
.lv { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.lv span { font-size: 16px; color: var(--muted); }
.timer { font-family: var(--font-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; text-align: right; }
.meta { grid-column: 1 / 3; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.board {
  --n: 2; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px;
  width: 100%; max-width: 100%; aspect-ratio: 1; background: var(--panel); padding: 8px; box-sizing: border-box;
  border-radius: 14px; border: 1px solid var(--line); touch-action: manipulation; user-select: none;
}
.tile { border: 0; padding: 0; border-radius: 6px; cursor: pointer; min-width: 0; min-height: 0; }
.tile:active { transform: scale(.96); }
.board.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.flash { position: fixed; inset: 0; pointer-events: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 48px; color: var(--bad); opacity: 0; }
.flash.show { animation: pop .6s; }
@keyframes pop { 0% { opacity: 1; transform: scale(.8) } 100% { opacity: 0; transform: scale(1.2) } }
.count { font-family: var(--font-display); font-weight: 700; font-size: 120px; text-align: center; padding-block: 60px; }
.mini { display: flex; flex-direction: column; gap: 8px; }

.result h2 { font-size: 24px; }
.rank { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rank:last-child { border-bottom: 0; }
.rank b { font-family: var(--font-display); font-size: 22px; }
.rank .t { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 11px; color: var(--muted); text-align: center; }
.legend div { padding: 6px 0; border-radius: 6px; background: var(--bg); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .board.shake, .flash.show { animation: none; } .track i { transition: none; } }
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>色感對決<small>COLOR DUEL</small></h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">未連線</span></div>
  </header>

  <!-- 大廳 -->
  <section id="lobby" class="card">
    <h2>雙人連線，20 關鬥快</h2>
    <p class="hint">每關有一格顏色跟其他格不一樣，最快點中它就過關。點錯加 3 秒。格子越來越多、色差越來越小，第 20 關的亮度差只剩約 2%。</p>
    <div>
      <label for="nick">你的暱稱</label>
      <input type="text" id="nick" maxlength="12" placeholder="例如：小林" autocomplete="off">
    </div>
    <div class="row">
      <button id="hostBtn">建立房間</button>
      <button id="soloBtn" class="ghost">單人練習</button>
    </div>
    <div>
      <label for="code">或輸入對手給你的房間代碼</label>
      <div class="row">
        <input type="text" id="code" maxlength="6" autocomplete="off" placeholder="例如：K7QH">
        <button id="joinBtn" class="ghost" style="flex:0 0 auto">加入</button>
      </div>
    </div>
    <p class="hint" id="lobbyMsg">一人按「建立房間」，把畫面上的代碼告訴對手；對手輸入代碼按「加入」。</p>
    <div class="legend" aria-label="難度表">
      <div>1–2 關<br>2×2</div><div>3–5 關<br>3×3</div><div>6–11 關<br>4–5 格</div><div>12–17 關<br>6–7 格</div><div>18–20 關<br>8×8</div>
    </div>
  </section>

  <!-- 房間 -->
  <section id="room" class="card" hidden>
    <div class="row" style="align-items:center">
      <div><label>房間代碼</label><div class="codebig" id="roomCode"></div></div>
      <button id="leaveBtn" class="ghost" style="flex:0 0 auto">離開</button>
    </div>
    <div class="players" id="players"></div>
    <p class="hint" id="roomMsg">等待對手加入…</p>
    <button id="readyBtn">我準備好了</button>
  </section>

  <!-- 倒數 -->
  <section id="countdown" hidden><div class="count" id="countNum">3</div></section>

  <!-- 遊戲 -->
  <section id="play" hidden>
    <div class="mini" id="race"></div>
    <div class="hud" style="margin-top:14px">
      <div class="lv" id="lvTxt">1<span> / 20</span></div>
      <div class="timer" id="timer">0.00</div>
      <div class="meta"><span id="deltaTxt"></span><span id="wrongTxt">點錯 0 次</span></div>
    </div>
    <div class="board" id="board" style="margin-top:10px"></div>
  </section>

  <!-- 結果 -->
  <section id="result" class="card result" hidden>
    <h2 id="resTitle">完成！</h2>
    <div id="resList"></div>
    <p class="hint" id="resMsg"></p>
    <div class="row"><button id="againBtn">再來一局</button></div>
  </section>
</div>
<div class="flash" id="flash">+3s</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const LEVELS = 20, PENALTY = 3, PREFIX = 'colorduel-tw-';
  // 由淺到深：格數與亮度差（OKLCH 的 L，單位 %）
  const GRID  = [2,2,3,3,3,4,4,4,5,5,5,6,6,6,7,7,7,8,8,8];
  const DELTA = [22,18,15,13,11.5,10,9,8,7.2,6.5,5.8,5.2,4.6,4.1,3.7,3.3,3,2.7,2.4,2.1];

  const $ = id => document.getElementById(id);
  const screens = ['lobby','room','countdown','play','result'];
  let screen = 'lobby';
  const show = s => { screen = s; screens.forEach(k => $(k).hidden = k !== s); };

  let peer = null, conn = null, isHost = false, solo = false;
  // players[0] 永遠是房主、players[1] 是加入者
  let players = [];
  let myIdx = 0;
  let game = null, curRid = null;

  // ---------- 工具 ----------
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const randCode = () => Array.from({length:4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  const fmt = s => s == null ? '—' : s.toFixed(2) + ' 秒';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
  const blank = nick => ({ nick, ready: false, rid: null, level: 0, done: false, time: null, wrong: 0 });
  const mine = () => players[myIdx];
  const other = () => players[1 - myIdx];
  function setConn(on, txt) { $('dot').classList.toggle('on', on); $('connTxt').textContent = txt; }

  function buildLevels(seed) {
    const r = rng(seed); const out = [];
    for (let i = 0; i < LEVELS; i++) {
      const n = GRID[i], d = DELTA[i];
      const L = 52 + r() * 22, C = 0.07 + r() * 0.11, H = Math.floor(r() * 360);
      const odd = Math.floor(r() * n * n);
      const dir = (L + d > 92) ? -1 : (r() < .5 ? -1 : 1);
      out.push({ n, d, odd, base: `oklch(${L.toFixed(1)}% ${C.toFixed(3)} ${H})`, diff: `oklch(${(L + dir*d).toFixed(1)}% ${C.toFixed(3)} ${H})` });
    }
    return out;
  }

  // ---------- 連線（PeerJS，兩台瀏覽器直接互連）----------
  function send(msg) { try { if (conn && conn.open) conn.send(msg); } catch {} }
  function sendMe() { send({ t: 'state', s: mine() }); }

  function needNick() {
    const nick = $('nick').value.trim();
    if (!nick) { $('lobbyMsg').textContent = '請先輸入暱稱。'; $('nick').focus(); return null; }
    store('cd-nick', nick); return nick;
  }
  if (typeof Peer === 'undefined') { $('lobbyMsg').textContent = '連線元件載入失敗，請確認網路後重新整理。仍可玩單人練習。'; }

  function lockLobby(on) { ['hostBtn','joinBtn','soloBtn'].forEach(id => $(id).disabled = on); }

  $('hostBtn').onclick = () => {
    const nick = needNick(); if (!nick || typeof Peer === 'undefined') return;
    lockLobby(true); $('lobbyMsg').textContent = '建立房間中…';
    const tryOpen = (attempt) => {
      const code = randCode();
      const p = new Peer(PREFIX + code.toLowerCase());
      p.on('open', () => {
        peer = p; isHost = true; solo = false; myIdx = 0; players = [blank(nick)];
        $('roomCode').textContent = code; setConn(true, '房間已建立');
        show('room'); renderRoom(); lockLobby(false);
      });
      p.on('connection', c => {
        if (conn && conn.open) { c.on('open', () => { c.send({ t: 'full' }); setTimeout(() => c.close(), 500); }); return; }
        bindConn(c);
      });
      p.on('error', e => {
        if (e.type === 'unavailable-id' && attempt < 3) { p.destroy(); tryOpen(attempt + 1); return; }
        if (!peer) { lockLobby(false); $('lobbyMsg').textContent = '建立房間失敗（' + e.type + '），請稍後再試。'; p.destroy(); }
      });
      p.on('disconnected', () => { if (peer === p && !p.destroyed) { setConn(false, '重新連線中…'); p.reconnect(); } });
    };
    tryOpen(0);
  };

  $('joinBtn').onclick = () => {
    const nick = needNick(); if (!nick || typeof Peer === 'undefined') return;
    const code = $('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { $('lobbyMsg').textContent = '請輸入 4 碼房間代碼。'; return; }
    lockLobby(true); $('lobbyMsg').textContent = '連線中…';
    const p = new Peer();
    let timer = setTimeout(() => { if (!conn || !conn.open) { $('lobbyMsg').textContent = '連不上這個房間，請確認代碼，或請對方重新建立房間。'; lockLobby(false); p.destroy(); } }, 12000);
    p.on('open', () => {
      peer = p; isHost = false; solo = false; myIdx = 1;
      const c = p.connect(PREFIX + code.toLowerCase(), { reliable: true });
      c.on('open', () => {
        clearTimeout(timer);
        players = [blank('房主'), blank(nick)];
        $('roomCode').textContent = code; show('room'); lockLobby(false);
        sendMe(); renderRoom();
      });
      bindConn(c);
    });
    p.on('error', e => {
      clearTimeout(timer);
      $('lobbyMsg').textContent = e.type === 'peer-unavailable' ? '找不到這個房間，請確認代碼是否正確。' : '連線失敗（' + e.type + '），請稍後再試。';
      lockLobby(false); p.destroy(); peer = null;
    });
  };

  function bindConn(c) {
    c.on('open', () => {
      conn = c; setConn(true, '已連線');
      if (isHost) { players[1] = blank('對手'); sendMe(); renderRoom(); }
    });
    c.on('data', onData);
    c.on('close', () => {
      if (conn !== c) return;
      conn = null; setConn(false, '對手已離線');
      if (isHost) players = [players[0]]; else if (players[0]) players[0].gone = true;
      refresh();
    });
  }

  function onData(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'full') { $('lobbyMsg').textContent = '這個房間已經有兩個人了。'; show('lobby'); return; }
    if (m.t === 'state' && m.s && typeof m.s === 'object') {
      const s = m.s; const o = players[1 - myIdx] || {};
      players[1 - myIdx] = { ...o, nick: String(s.nick || '對手').slice(0, 12), ready: !!s.ready, rid: s.rid || null,
        level: Math.max(0, Math.min(LEVELS, +s.level || 0)), done: !!s.done, time: typeof s.time === 'number' ? s.time : null, wrong: +s.wrong || 0 };
      if (isHost) maybeStart();
      refresh();
    }
    if (m.t === 'start' && !isHost && m.id && m.id !== curRid && screen === 'room') startRound({ id: m.id, seed: m.seed });
  }

  function refresh() { if (screen === 'room') renderRoom(); else renderRace(); }

  function maybeStart() {
    if (screen !== 'room' || players.length < 2 || !players.every(p => p.ready)) return;
    const round = { id: 'r' + Date.now().toString(36), seed: Math.floor(Math.random() * 1e9) };
    send({ t: 'start', ...round });
    startRound(round);
  }

  $('leaveBtn').onclick = () => {
    try { conn?.close(); } catch {} try { peer?.destroy(); } catch {}
    conn = null; peer = null; players = []; setConn(false, '未連線'); show('lobby');
  };

  // ---------- 房間 ----------
  function playerRow(p, i, rid) {
    const col = i === 0 ? 'var(--p1)' : 'var(--p2)';
    const inRound = rid && p.rid === rid;
    let pill = p.ready ? '<span class="pill ready">已準備</span>' : '<span class="pill">未準備</span>';
    if (inRound) pill = p.done ? `<span class="pill done">${esc(fmt(p.time))}</span>` : `<span class="pill">第 ${Math.min(p.level + 1, LEVELS)} 關</span>`;
    if (p.gone) pill = '<span class="pill">已離線</span>';
    const pct = inRound ? (p.level / LEVELS * 100) : 0;
    return `<div class="pl"><span class="sw" style="background:${col}"></span><span class="nm">${esc(p.nick)}${i === myIdx ? '<em>你</em>' : ''}</span>${pill}<div class="track"><i style="width:${pct}%;background:${col}"></i></div></div>`;
  }

  function renderRoom() {
    $('players').innerHTML = players.map((p, i) => p ? playerRow(p, i, null) : '').join('');
    $('readyBtn').textContent = mine()?.ready ? '取消準備' : '我準備好了';
    const ok = players.length === 2 && conn && conn.open;
    if (!ok) $('roomMsg').textContent = isHost ? '等待對手加入…把上面的房間代碼告訴對方。' : '與房主的連線中斷，請離開後重新加入。';
    else if (players.every(p => p.ready)) $('roomMsg').textContent = '雙方都準備好了，即將開始！';
    else $('roomMsg').textContent = '雙方都按「我準備好了」就會開始倒數。';
  }

  $('readyBtn').onclick = () => {
    if (!mine()) return;
    mine().ready = !mine().ready; sendMe(); renderRoom();
    if (isHost) maybeStart();
  };

  // ---------- 回合 ----------
  function startRound(round) {
    curRid = round.id;
    game = { levels: buildLevels(round.seed), i: 0, wrong: 0, t0: 0, done: false, time: null, raf: 0 };
    if (!solo) { Object.assign(mine(), { ready: false, rid: round.id, level: 0, done: false, time: null, wrong: 0 }); sendMe(); }
    show('countdown');
    let c = 3; $('countNum').textContent = c;
    const iv = setInterval(() => {
      c--; if (c > 0) { $('countNum').textContent = c; return; }
      clearInterval(iv); beginPlay();
    }, 800);
  }

  function beginPlay() {
    show('play');
    game.t0 = performance.now();
    renderLevel(); renderRace();
    const tick = () => { if (!game || game.done) return; $('timer').textContent = elapsed().toFixed(2); game.raf = requestAnimationFrame(tick); };
    tick();
  }
  const elapsed = () => (performance.now() - game.t0) / 1000 + game.wrong * PENALTY;

  function renderLevel() {
    const lv = game.levels[game.i];
    $('lvTxt').innerHTML = `${game.i + 1}<span> / ${LEVELS}</span>`;
    $('deltaTxt').textContent = `${lv.n}×${lv.n} 格 · 亮度差 ΔL ${lv.d}%`;
    $('wrongTxt').textContent = `點錯 ${game.wrong} 次`;
    const b = $('board'); b.style.setProperty('--n', lv.n);
    b.style.gap = lv.n >= 7 ? '4px' : '6px';
    let html = '';
    for (let k = 0; k < lv.n * lv.n; k++) html += `<button class="tile" data-k="${k}" aria-label="色塊 ${k+1}" style="background:${k === lv.odd ? lv.diff : lv.base}"></button>`;
    b.innerHTML = html;
  }

  $('board').addEventListener('pointerdown', e => {
    const t = e.target.closest('.tile'); if (!t || !game || game.done || screen !== 'play') return;
    e.preventDefault(); pick(+t.dataset.k);
  });
  $('board').addEventListener('keydown', e => {
    const t = e.target.closest('.tile'); if (!t || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); pick(+t.dataset.k);
  });

  function pick(k) {
    const lv = game.levels[game.i];
    if (k !== lv.odd) {
      game.wrong++; $('wrongTxt').textContent = `點錯 ${game.wrong} 次`;
      const b = $('board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      const f = $('flash'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
      if (!solo) { mine().wrong = game.wrong; sendMe(); }
      return;
    }
    game.i++;
    if (game.i >= LEVELS) return finish();
    if (!solo) { mine().level = game.i; sendMe(); }
    renderLevel(); renderRace();
  }

  function finish() {
    game.done = true; cancelAnimationFrame(game.raf);
    game.time = Math.round(elapsed() * 100) / 100;
    if (!solo) { Object.assign(mine(), { level: LEVELS, done: true, time: game.time }); sendMe(); }
    show('result'); renderRace();
  }

  function renderRace() {
    if (solo) {
      $('race').innerHTML = '';
      if (screen === 'result') {
        $('resTitle').textContent = '練習完成！';
        $('resList').innerHTML = `<div class="rank"><b>—</b><span>${esc($('nick').value.trim() || '我')}</span><span class="t">${fmt(game.time)}</span></div>`;
        $('resMsg').textContent = `點錯 ${game.wrong} 次（每次 +${PENALTY} 秒）。`;
        $('againBtn').textContent = '再練一次';
      }
      return;
    }
    $('race').innerHTML = players.map((p, i) => p ? playerRow(p, i, curRid) : '').join('');
    if (screen !== 'result') return;
    const rows = players.map((p, i) => ({ p, i, inR: p && p.rid === curRid })).filter(r => r.p);
    const finished = rows.filter(r => r.inR && r.p.done).sort((a, b) => a.p.time - b.p.time);
    const pending = rows.filter(r => !(r.inR && r.p.done));
    $('resList').innerHTML = [...finished, ...pending].map((r, idx) => {
      const place = r.inR && r.p.done ? idx + 1 : '…';
      const t = r.inR && r.p.done ? fmt(r.p.time) : (r.p.gone ? '已離線' : r.inR ? `第 ${Math.min(r.p.level + 1, LEVELS)} 關中` : '未參加');
      return `<div class="rank"><b style="color:${r.i === 0 ? 'var(--p1)' : 'var(--p2)'}">${place}</b><span>${esc(r.p.nick)}${r.i === myIdx ? '（你）' : ''} · 錯 ${r.p.wrong || 0}</span><span class="t">${esc(t)}</span></div>`;
    }).join('');
    if (finished.length === 2) {
      const w = finished[0];
      $('resTitle').textContent = w.i === myIdx ? '你贏了！' : `${w.p.nick} 獲勝`;
      $('resMsg').textContent = `相差 ${(finished[1].p.time - finished[0].p.time).toFixed(2)} 秒。點錯每次加 ${PENALTY} 秒。`;
    } else if (!conn || !conn.open) {
      $('resTitle').textContent = '你完成了！'; $('resMsg').textContent = '對手已離線。';
    } else {
      $('resTitle').textContent = '你完成了！'; $('resMsg').textContent = '等待對手完成…';
    }
    $('againBtn').textContent = '回房間再來一局';
  }

  $('againBtn').onclick = () => {
    if (solo) { startRound({ id: 'solo' + Date.now(), seed: Math.floor(Math.random()*1e9) }); return; }
    show('room'); renderRoom();
  };

  $('soloBtn').onclick = () => { solo = true; startRound({ id: 'solo' + Date.now(), seed: Math.floor(Math.random()*1e9) }); };

  $('nick').value = store('cd-nick') || '';
})();
</script>
</body>
</html>
